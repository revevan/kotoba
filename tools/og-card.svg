<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="glow" cx="26%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#26264a"/>
      <stop offset="55%" stop-color="#15152400"/>
      <stop offset="100%" stop-color="#10101a"/>
    </radialGradient>
    <linearGradient id="dia" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8f8ff6"/>
      <stop offset="100%" stop-color="#6a6ae4"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="#10101a"/>
  <rect width="1200" height="1200" fill="url(#glow)"/>

  <!-- emblem (vertically centered at y=600) -->
  <g transform="translate(300 600)">
    <rect x="-108" y="-108" width="216" height="216" rx="26" fill="#7c7cf0" opacity="0.35" filter="url(#soft)" transform="rotate(45)"/>
    <rect x="-100" y="-100" width="200" height="200" rx="24" fill="url(#dia)" transform="rotate(45)"/>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="central"
      font-family="Songti SC, Songti, serif" font-size="96" fill="#10101a">言葉</text>
  </g>

  <!-- headline -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#f0f0f5">
    <text x="548" y="571" font-size="132" font-weight="700" letter-spacing="-2">Kotoba</text>
    <text x="552" y="641" font-size="40" fill="#a6a6ba">Learn Japanese by voice —</text>
    <text x="552" y="693" font-size="40" fill="#a6a6ba">hands-free, on your commute.</text>
    <text x="554" y="759" font-size="27" fill="#7c7cf0" letter-spacing="3">kotobaapp.com</text>
  </g>
</svg>
