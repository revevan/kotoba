name = "kotoba-api"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
# The origin your app is served from (no trailing slash). Update if you move
# the app to a custom domain.
ALLOWED_ORIGIN = "https://revevan.github.io"
APP_NAME = "Kotoba"
# Requires kotobaapp.com to be verified in Resend (add the DNS records Resend
# shows, in the domain's Cloudflare DNS). Until verified, Resend only delivers
# to your own account email.
MAIL_FROM = "Kotoba <login@kotobaapp.com>"

[[d1_databases]]
binding = "DB"
database_name = "kotoba"
database_id = "e416814c-b776-4a1f-9f39-66af94446d11"

# RESEND_API_KEY is a secret, set it with:
#   wrangler secret put RESEND_API_KEY
