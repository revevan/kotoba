name = "kotoba-api"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
# The origin your app is served from (no trailing slash). Update if you move
# the app to a custom domain.
ALLOWED_ORIGIN = "https://kotobaapp.com,https://www.kotobaapp.com,https://revevan.github.io"
APP_NAME = "Kotoba"
# Requires kotobaapp.com to be verified in Resend (add the DNS records Resend
# shows, in the domain's Cloudflare DNS). Until verified, Resend only delivers
# to your own account email.
MAIL_FROM = "Kotoba <login@kotobaapp.com>"
# Feedback submissions are forwarded here (best-effort).
NOTIFY_EMAIL = "revevan@gmail.com"
# Accounts allowed on the content-review page (app origin /review/).
# Comma-separated login emails; add the reviewer's email here.
REVIEWER_EMAILS = "revevan@gmail.com,mikimikit@gmail.com"

[[d1_databases]]
binding = "DB"
database_name = "kotoba"
database_id = "e416814c-b776-4a1f-9f39-66af94446d11"

# RESEND_API_KEY is a secret, set it with:
#   wrangler secret put RESEND_API_KEY

# Per-IP rate limits: feedback spam + login-code email abuse.
[[unsafe.bindings]]
name = "RATE_FEEDBACK"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "RATE_AUTH"
type = "ratelimit"
namespace_id = "2002"
simple = { limit = 6, period = 60 }
