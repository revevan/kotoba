# This workflow is written for the standalone kotoba repo (app at repo root).
# It activates automatically once this folder is pushed to revevan/kotoba.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Served from the root of the custom domain (kotobaapp.com).
          BASE_PATH: /
          # URL of the deployed STT proxy (see server/stt-proxy). When unset the
          # app falls back to the built-in Web Speech recognizer.
          VITE_STT_ENDPOINT: ${{ secrets.STT_ENDPOINT }}
          # URL of the deployed login/sync API (see server/api). When unset the
          # app runs local-only with no sign-in.
          VITE_API_ENDPOINT: ${{ secrets.API_ENDPOINT }}
          # Audio corpus on Cloudflare R2 (not a secret — it's a public CDN
          # host). When set, the build strips dist/audio and the app fetches
          # clips from here; unset it to roll back to same-origin audio.
          VITE_AUDIO_BASE_URL: https://audio.kotobaapp.com/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # First non-empty page_url across the attempts (empty string is falsy).
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      # The Pages backend (actions/deploy-pages) intermittently returns
      # "Deployment failed, try again later." even when the artifact is fine —
      # a transient GitHub-side flake. The build already succeeded, so retry the
      # publish a couple of times with back-off before giving up.
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure'
        run: echo "deploy attempt 1 failed — retrying in 30s" && sleep 30
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: echo "deploy attempt 2 failed — retrying in 60s" && sleep 60
      - id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
