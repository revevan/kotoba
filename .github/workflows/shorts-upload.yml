# Daily shorts upload: reviewer-approved videos → YouTube (private, scheduled
# one per weekday at 15:00 UTC). ≤6 per run because videos.insert costs 1,600
# of the 10,000 daily quota units.
name: Shorts — upload approved

on:
  schedule:
    - cron: '0 12 * * *'  # daily 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shorts-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/shorts/upload.mjs
        env:
          KOTOBA_ADMIN_SECRET: ${{ secrets.KOTOBA_ADMIN_SECRET }}
          GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
